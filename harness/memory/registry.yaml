# Rule registry — the authoritative register of approved decision rules.
#
# Every rule the harness contains has an entry here; the rule's prose lives
# in the file named by `location`, anchored with <!-- rule: R-#### -->.
# tools/lint_harness.py checks that anchors and entries match one-to-one.
#
# Entry schema
#   id:            stable, never reused.  R-00xx data readiness · R-01xx target
#                  · R-02xx validation · R-03xx modelling · R-04xx adaptation
#                  · R-05xx submission
#   statement:     the rule in one or two lines, imperative
#   applies_to:    data_readiness | target | validation | modelling | adaptation | submission | process
#   origin:        WEEK1_TEAM      — learned by the team in Part 1 (human + AI pair work)
#                  ACTUARY         — method authored by the actuary for Part 2
#                  AGENT_RETRO     — proposed by an agent in a retrospective (cycle ≥ 1)
#                  STANDARD_PRACTICE
#   evidence:      where the rule came from (Week 1 README section / experiment, or the
#                  cycle scorecard), one line
#   source_cycle:  0 = harness v1 (before any Part 2 agent run)
#   approved_by:   actuary (HyunSu Kim) unless stated
#   status:        ACTIVE | RETIRED
#   location:      playbooks/<file>.md
#
# Harness v1 integrity note: every v1 rule is traceable to the Week 1 README
# or to the actuary's adaptation protocol. Nothing learned from profiling the
# emerging data is in v1; such findings may enter only from cycle 1 onward,
# with origin AGENT_RETRO or ACTUARY and the cycle recorded.

